services:
  - type: web
    name: vantage-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # v2 pointed at "app.py", which has never existed in this repo — the deploy
    # could not have started. Uvicorn is invoked directly rather than through
    # gunicorn: uvicorn.workers.UvicornWorker is deprecated since uvicorn 0.30,
    # and uvicorn manages workers natively.
    # Migrations run first and always exit 0: a bad revision must leave the
    # previous schema serving rather than stop the service booting.
    # /api/health reports the schema state so it degrades visibly, not silently.
    #
    # ONE worker, and this is load-bearing rather than a tuning choice.
    #
    # `jobs = JobManager()` in app/analysis/runner.py is a module-level dict, so
    # there is one of it per *process*. Starting an analysis and streaming its
    # progress are two separate HTTP connections, and uvicorn's workers share a
    # listening socket, so the OS hands the second one to whichever process is
    # free — not to the one holding the job.
    #
    # With two workers that is a coin flip: about half of all analyses showed
    # "That analysis is no longer available" from /api/analyze/{id}/events while
    # the analysis was running perfectly well in the other process. The report
    # still landed in the database; the user just never saw it happen.
    #
    # Raising this again requires moving job state out of process first.
    # tests/test_deployment.py enforces that pairing so the two cannot drift.
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Analysis holds an extracted repository on disk; give it room.
      - key: MAX_EXTRACTED_BYTES
        value: "524288000"
      # Where a report lives, for links this service publishes elsewhere — the
      # pull request comment embeds it. Not a secret, so it is stated here
      # rather than left to the dashboard: unset, it falls back to
      # http://localhost:3000 and posts a localhost link into someone's PR.
      - key: APP_BASE_URL
        value: https://vantage67.vercel.app
      # Set these in the Render dashboard, not here.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Sign-in. Optional as a group — with none of them set the service runs
      # exactly as before and /api/health says sign-in is unconfigured.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
